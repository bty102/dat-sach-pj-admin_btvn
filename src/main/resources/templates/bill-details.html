<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>

<div th:replace="header::header">

</div>
    <div th:object="${bill}">
        <div>Mã hóa đơn: <span th:text="*{id}"></span></div>
        <div>Mã Khách hàng: <span th:text="*{customer.id}"></span></div>
        <div>Họ tên Khách hàng: <span th:text="*{customer.fullName}"></span></div>
        <div>Tổng số sách: <span th:text="*{getNumberOfBooks()}"></span></div>
        <div>Thành tiền: <span th:text="*{getTotalBill()}"></span></div>
        <div>Thanh toán: <span th:text="*{isPaid? 'Đã thanh toán' : 'Chưa thanh toán'}"></span></div>
        <div th:if="${confirmPaymentSuccessMsg}">
            <span th:text="${confirmPaymentSuccessMsg}"></span>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>Mã sách</th>
                    <th>Tên sách</th>
                    <th>Ảnh</th>
                    <th>Đơn Giá</th>
                    <th>Số lượng mua</th>
                    <th>Thành tiền</th>
                    <th>Thanh toán</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="billDetail : *{billDetails}">
                    <td th:text="${billDetail.book.id}"></td>
                    <td th:text="${billDetail.book.name}"></td>
                    <td><img th:src="@{'/' + ${billDetail.book.imagePath}}"></td>
                    <td th:text="${billDetail.book.price}"></td>
                    <td th:text="${billDetail.quantity}"></td>
                    <td th:text="${billDetail.getTotal()}"></td>
                    <td th:text="${billDetail.isPaid? 'Đã thanh toán' : 'Chưa thanh toán'}"></td>
                    <td>
                        <a onclick="return confirm('Xác nhận đã thanh toán?')" th:if="${!billDetail.isPaid}" th:href="@{'/billdetails/confirmPayment/' + ${billDetail.id}}">Xác nhận</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

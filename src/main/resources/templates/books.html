<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách các quyển sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>

<div th:replace="header::header">

</div>

<div class="container">
    <div class="row">
        <div class="col-sm-2">
            <div th:each="category : ${categories}" th:object="${category}">
                <a  th:href="@{'/books?cateId=' + *{id}}" th:text="*{name}"></a>
            </div>
        </div>
        <div class="col-sm-10">
            <div class="d-flex justify-content-end">
                <form th:action="@{/books}" method="get">
                    <input type="search" name="key" placeholder="Nhập tên sách hoặc tác giả...">
                    <button type="submit">Tìm kiếm</button>
                </form>
            </div>
            <div th:if="${updateUnsuccessMsg != null}">
                <span th:text="${updateUnsuccessMsg}"></span>
            </div>
            <div th:if="${updateSuccessMsg != null}">
                <span th:text="${updateSuccessMsg}"></span>
            </div>
            <div th:if="${creationUnsuccessMsg != null}">
                <span th:text="${creationUnsuccessMsg}"></span>
            </div>
            <div th:if="${creationSuccessMsg != null}">
                <span th:text="${creationSuccessMsg}"></span>
            </div>
            <div th:if="${deletionSucessMsg != null}">
                <span th:text="${deletionSucessMsg}"></span>
            </div>
            <div th:if="${deletionUnsuccessMsg != null}">
                <span th:text="${deletionUnsuccessMsg}"></span>
            </div>
            <div>
                <a th:href="@{/books/create}">Tạo mới</a>
            </div>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Mã sách</th>
                        <th>Tên sách</th>
                        <th>Số lượng</th>
                        <th>Giá</th>
                        <th>Số tập</th>
                        <th>Ảnh</th>
                        <th>Ngày nhập</th>
                        <th>Tác giả</th>
                        <th>Loại</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}" th:object="${book}">
                        <td th:text="*{id}"></td>
                        <td th:text="*{name}"></td>
                        <td th:text="*{quantity}"></td>
                        <td th:text="*{price}"></td>
                        <td th:text="*{numberOfVolumes}"></td>
                        <td><img class="w-50" th:src="@{'/' + *{imagePath}}"></td>
                        <td th:text="*{importDate.toString()}"></td>
                        <td th:text="*{author}"></td>
                        <td th:text="*{category.name}"></td>
                        <td>
                            <a th:href="@{'/books/update/' + *{id}}">Cập nhật</a>
                            <a onclick="return confirm('Xóa sách này?')" th:href="@{'/books/delete/' + *{id}}">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${books.isEmpty()}">
                <span>Không có sách nào</span>
            </div>
            <div>
                <nav aria-label="Page navigation example">
                    <ul class="pagination">
                        <li th:each="pageNumber : ${#numbers.sequence(1, totalPages, 1)}" th:class="${'page-item ' + (pageNumber == currentPage? 'active' : '')}"><a class="page-link" th:href="@{'/books?' + ${key!=null? ('key=' + key) : (cateId!=null? ('cateId=' + cateId) : '')} + '&pageNumber=' + ${pageNumber}}" th:text="${pageNumber}"></a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>
